<!DOCTYPE html>
<html>
  <head>
    <title>The Fel1kMan Dictionary</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
      }

      .title-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 40px;
      }

      .title-container img {
        width: 120px;
        height: auto;
        border-radius: 10px;
      }

      h1 {
        font-size: 40px;
        margin: 0;
      }

      .dictionary-section {
        margin-top: 50px;
        text-align: left;
        width: 70%;
        margin-left: auto;
        margin-right: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
      }

      .entry {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
      }

      .entry img {
        width: 150px;
        height: auto;
        border-radius: 10px;
      }

      .entry-text {
        flex: 1;
      }

      .dictionary-section h2 {
        font-size: 28px;
        margin-top: 30px;
        margin-bottom: 10px;
      }

      .dictionary-section p {
        font-size: 18px;
        margin: 0;
      }

      .footer {
        margin-top: 60px;
        text-align: center;
        font-size: 16px;
        color: #555;
        padding-bottom: 40px;
      }

      .footer img {
        width: 60px;
        height: auto;
        border-radius: 10px;
        margin-top: 10px;
      }

      .version {
        margin-top: 10px;
        font-size: 14px;
        color: #777;
      }

      .approval, .cfmlg {
        margin-top: 20px;
        font-size: 16px;
        color: #444;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      .approval img, .cfmlg img {
        width: 60px;
        height: auto;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <div class="title-container">
      <img src="image1.png" alt="Left image">
      <h1>The Fel1kMan Dictionary</h1>
      <img src="image2.png" alt="Right image">
    </div>

    <div class="dictionary-section">
      <!-- A–Z Dictionary content here -->
    </div>

    <div class="footer">

      <p>This website was made by Carlo (CarloCarloCarlo1)</p>
      <img src="image7.png" alt="Carlo image small">

      <div class="approval">
        Approved by Fel1k
        <img src="image1.png" alt="Fel1k approval">
      </div>

      <div class="cfmlg">
        A CFMLG production
        <img src="image12.png" alt="CFMLG logo">
      </div>

      <p>This website is for educational and entertainment purposes only and should not be taken seriously or personally.</p>

      <div class="version">Version 1.1</div>

    </div>

  </body>
</html>
